<!DOCTYPE html>
<html lang="en" data-theme="light" data-density="default">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Trilayer Design System — Three layers. One source of truth. Production-grade design tokens, adaptive components, and enterprise architecture.">
  <meta name="theme-color" content="#FFFFFF">
  <meta name="color-scheme" content="light">
  <meta property="og:title" content="Trilayer — Three layers. One source of truth.">
  <meta property="og:description" content="Trilayer Design System — Production-grade design tokens, adaptive components, and enterprise architecture.">
  <meta property="og:image" content="assets/og-image.png">
  <meta property="og:type" content="website">
  <title>Trilayer — Three layers. One source of truth.</title>

  <link rel="icon" type="image/png" href="assets/favicon.png">

  <!-- Trilayer 3-Layer Token Cascade -->
  <link rel="stylesheet" href="css/tokens.primitives.css">
  <link rel="stylesheet" href="css/tokens.semantic.css">
  <link rel="stylesheet" href="css/tokens.components.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">

  <!-- Component Layer Stylesheets -->
  <link rel="stylesheet" href="css/components/button.css">
  <link rel="stylesheet" href="css/components/input.css">
  <link rel="stylesheet" href="css/components/controls.css">
  <link rel="stylesheet" href="css/components/card.css">
  <link rel="stylesheet" href="css/components/badge-chip.css">
  <link rel="stylesheet" href="css/components/dialog.css">
  <link rel="stylesheet" href="css/components/feedback.css">
  <link rel="stylesheet" href="css/components/tabs-divider.css">
  <link rel="stylesheet" href="css/components/avatar.css">
  <link rel="stylesheet" href="css/components/skeleton.css">
  <link rel="stylesheet" href="css/components/callout.css">
  <link rel="stylesheet" href="css/components/spinner.css">

  <!-- Docs Portal Styling: Layer Inspector, Code Blocks, Playgrounds -->
  <link rel="stylesheet" href="css/docs.css">

  <!-- Anti-FOUC Theme & Density Initialization (Pure Light Mode) -->
  <script>
    (function() {
      try {
        document.documentElement.setAttribute("data-theme", "light");
        var savedDensity = localStorage.getItem("trilayer_docs_density") || "default";
        document.documentElement.setAttribute("data-density", savedDensity);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <!-- 1. Accessible Skip-to-Content Link -->
  <a href="#main-content" class="skip-to-content">Skip to main content</a>

  <div class="tl-app">
    <!-- 2. Sticky App Header -->
    <header class="tl-header" role="banner">
      <div class="tl-header-left">
        <!-- Mobile Drawer Hamburger Toggle -->
        <button id="tl-nav-toggle" class="tl-nav-toggle" aria-label="Toggle navigation drawer" aria-expanded="false" aria-controls="tl-sidebar">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        </button>

        <!-- Brand Home Link with 3-Stacked Planes SVG Motif -->
        <a href="#/" class="tl-brand-link" aria-label="Trilayer Design System Home">
          <svg class="tl-brand-logo-svg" viewBox="0 0 32 32" fill="none" aria-hidden="true">
            <!-- Top plane: Teal (Component Layer) -->
            <path d="M16 3L30 10L16 17L2 10L16 3Z" fill="var(--tl-sys-color-layer-component)" opacity="0.95"/>
            <!-- Middle plane: Indigo (Semantic Layer) -->
            <path d="M16 10L30 17L16 24L2 17L16 10Z" fill="var(--tl-sys-color-layer-semantic)" opacity="0.95"/>
            <!-- Bottom plane: Slate (Primitives Layer) -->
            <path d="M16 17L30 24L16 31L2 24L16 17Z" fill="var(--tl-sys-color-layer-primitives)"/>
          </svg>
          <span class="tl-brand-title">Trilayer</span>
          <span class="tl-brand-version">v2.0</span>
        </a>

        <!-- Desktop Navigation Section Links -->
        <nav class="tl-header-nav" aria-label="Primary sections navigation">
          <a href="#/" class="tl-header-nav-link" id="nav-link-overview">Overview</a>
          <a href="#/foundations/color" class="tl-header-nav-link" id="nav-link-foundations">Foundations</a>
          <a href="#/tokens/layers" class="tl-header-nav-link" id="nav-link-tokens">Tokens</a>
          <a href="#/components/button" class="tl-header-nav-link" id="nav-link-components">Components</a>
          <a href="#/resources/figma" class="tl-header-nav-link" id="nav-link-figma">Figma</a>
        </nav>
      </div>

      <!-- Header Right: Search, Density Selector, GitHub Link -->
      <div class="tl-header-right">
        <!-- Command Palette Search Trigger -->
        <button id="tl-search-trigger" class="tl-search-trigger" aria-label="Search documentation (Press Cmd+K)">
          <svg class="tl-search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <span class="tl-search-placeholder">Search docs &amp; tokens...</span>
          <kbd class="tl-kbd">⌘K</kbd>
        </button>

        <!-- Density Selector with subtle icon badge -->
        <div class="tl-density-wrapper" title="Interface Density">
          <svg class="tl-density-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
            <line x1="3" y1="9" x2="21" y2="9"/>
            <line x1="3" y1="15" x2="21" y2="15"/>
          </svg>
          <select id="tl-density-select" class="tl-density-select" aria-label="Select interface density">
            <option value="compact">Compact</option>
            <option value="default" selected>Default</option>
            <option value="comfortable">Comfortable</option>
          </select>
        </div>

        <!-- GitHub Repository Link -->
        <a href="https://github.com/dt019107/trilayer-design-system" target="_blank" rel="noopener noreferrer" class="tl-header-btn" aria-label="View Trilayer on GitHub" title="GitHub Repository">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"></path>
          </svg>
        </a>
      </div>
    </header>

    <!-- 3. Layout Body: Sidebar + Main Canvas -->
    <div class="tl-body">
      <!-- Mobile Backdrop Scrim -->
      <div id="tl-scrim" class="tl-scrim" aria-hidden="true"></div>

      <!-- Navigation Drawer / Sidebar -->
      <aside id="tl-sidebar" class="tl-sidebar" aria-label="Primary Documentation Navigation">
        <div class="tl-sidebar-header">
          <a href="#/" class="tl-brand-link">
            <svg class="tl-brand-logo-svg" viewBox="0 0 32 32" fill="none" aria-hidden="true">
              <path d="M16 3L30 10L16 17L2 10L16 3Z" fill="var(--tl-sys-color-layer-component)" opacity="0.95"/>
              <path d="M16 10L30 17L16 24L2 17L16 10Z" fill="var(--tl-sys-color-layer-semantic)" opacity="0.95"/>
              <path d="M16 17L30 24L16 31L2 24L16 17Z" fill="var(--tl-sys-color-layer-primitives)"/>
            </svg>
            <span class="tl-brand-title">Trilayer</span>
          </a>
          <button id="tl-sidebar-close" class="tl-header-btn" aria-label="Close navigation drawer">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>

        <nav id="tl-sidebar-nav" class="tl-sidebar-content">
          <!-- Dynamically populated from data/navigation.js by NavigationController -->
        </nav>
      </aside>

      <!-- Main Reading Canvas -->
      <main id="main-content" class="tl-main" tabindex="-1">
        <div class="tl-content-container">
          <!-- Accessible Breadcrumbs -->
          <nav aria-label="Breadcrumb">
            <ol id="tl-breadcrumbs" class="tl-breadcrumbs"></ol>
          </nav>

          <!-- Dynamic View Mount Container -->
          <noscript>
            <div style="margin: 32px 0; padding: 24px; border: 1px solid var(--tl-sys-color-outline-variant); border-radius: var(--tl-sys-shape-container); background: var(--tl-sys-color-surface-container);">
              <h2 style="font-size: 20px; margin-bottom: 8px;">JavaScript Required</h2>
              <p style="color: var(--tl-sys-color-on-surface-variant); font-size: 14px;">
                The Trilayer documentation portal requires JavaScript to navigate between routes, inspect dynamic token chains, and run interactive component playgrounds. Please enable JavaScript in your browser to view the documentation.
              </p>
            </div>
          </noscript>
          <article id="tl-view-container"></article>

          <!-- Accessible Site Footer Landmark -->
          <footer class="tl-footer" role="contentinfo" aria-label="Documentation Footer" style="margin-top: 64px; padding-top: 24px; border-top: 1px solid var(--tl-sys-color-outline-variant); color: var(--tl-sys-color-on-surface-variant); font-size: 13px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px;">
            <p>Trilayer Design System v2.0 — Three layers. One source of truth.</p>
            <p>Built with WCAG 2.2 AA compliant tokens and components.</p>
          </footer>
        </div>
      </main>

      <!-- Right-Hand Table of Contents ("On this page") Rail -->
      <aside id="tl-toc" class="tl-toc" aria-label="Table of contents">
        <div class="tl-toc-header">On this page</div>
        <nav id="tl-toc-nav" class="tl-toc-nav">
          <!-- Populated dynamically per route by TableOfContents in js/toc.js -->
        </nav>
      </aside>
    </div>
  </div>

  <!-- Command Palette Modal (Cmd+K / Ctrl+K) -->
  <div id="tl-search-modal" class="tl-command-palette-overlay" role="dialog" aria-modal="true" aria-label="Command Palette" aria-hidden="true">
    <div class="tl-command-palette-modal">
      <div class="tl-command-palette-header">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="tl-search-input" class="tl-command-palette-input" placeholder="Search components, tokens, foundations... (e.g. 'button')">
        <kbd class="tl-kbd">ESC</kbd>
      </div>
      <div id="tl-search-status" class="sr-only" role="status" aria-live="polite"></div>
      <div id="tl-search-results" class="tl-command-palette-results" role="listbox"></div>
      <div class="tl-command-palette-footer">
        <span>Use <kbd class="tl-kbd">&uarr;</kbd> <kbd class="tl-kbd">&darr;</kbd> to navigate</span>
        <span><kbd class="tl-kbd">&crarr;</kbd> to select</span>
        <span><kbd class="tl-kbd">ESC</kbd> to dismiss</span>
      </div>
    </div>
  </div>

  <!-- Global Toast Notification Container -->
  <div id="tl-toast-container" class="tl-toast-container" aria-live="polite"></div>

  <!-- Client-side Application Bootstrap (ES Module) -->
  <script type="module" src="js/main.js"></script>
</body>
</html>
