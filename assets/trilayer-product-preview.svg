<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="auto" style="background:#0d1522; border-radius:12px; font-family:'Public Sans', -apple-system, sans-serif;">
  <defs>
    <clipPath id="window-clip">
      <rect width="1200" height="680" rx="12" />
    </clipPath>
  </defs>

  <g clip-path="url(#window-clip)">
    <!-- Window Background & Header -->
    <rect width="1200" height="680" fill="#0d1522" />
    <rect width="1200" height="44" fill="#141e2e" stroke="#1f2d42" stroke-width="1" />

    <!-- Window Controls -->
    <circle cx="24" cy="22" r="6" fill="#ef4444" opacity="0.8" />
    <circle cx="44" cy="22" r="6" fill="#f59e0b" opacity="0.8" />
    <circle cx="64" cy="22" r="6" fill="#10b981" opacity="0.8" />

    <!-- Window Title -->
    <text x="600" y="27" fill="#8b9cb0" font-size="13" font-weight="500" text-anchor="middle">Trilayer Design System — Figma Variables &amp; Dev Mode Architecture (v1.0.0)</text>

    <!-- Dev Mode Active Pill -->
    <rect x="1060" y="10" width="116" height="24" rx="12" fill="#2d55ff" />
    <text x="1118" y="26" fill="#ffffff" font-size="11" font-weight="600" text-anchor="middle">⚡ Dev Mode</text>

    <!-- Subheader Tabs -->
    <rect y="44" width="1200" height="38" fill="#101927" stroke="#1f2d42" stroke-width="1" />
    <text x="24" y="68" fill="#ffffff" font-size="13" font-weight="600">🎨 Foundations &amp; Variables</text>
    <text x="200" y="68" fill="#8b9cb0" font-size="13">🧩 Core Components</text>
    <text x="340" y="68" fill="#8b9cb0" font-size="13">📐 Tokens Studio Sync</text>

    <!-- Workspace Grid: Left Sidebar (Variables Hierarchy) -->
    <rect y="82" width="280" height="598" fill="#141e2e" stroke="#1f2d42" stroke-width="1" />
    
    <text x="20" y="112" fill="#8b9cb0" font-size="11" font-weight="700" letter-spacing="0.05em">VARIABLE COLLECTIONS</text>

    <!-- Collection 1: Primitives -->
    <g transform="translate(16, 128)">
      <rect width="248" height="34" rx="6" fill="#1b273b" />
      <text x="12" y="22" fill="#c6d2df" font-size="12" font-weight="600">📁 01_Primitives (48)</text>
      <text x="236" y="22" fill="#8b9cb0" font-size="11" text-anchor="end">Value</text>
    </g>

    <!-- Collection 2: Semantics (Expanded) -->
    <g transform="translate(16, 170)">
      <rect width="248" height="154" rx="6" fill="#101927" stroke="#1f2d42" stroke-width="1" />
      <text x="12" y="24" fill="#ffffff" font-size="12" font-weight="600">📂 02_Semantics (34)</text>
      <rect x="180" y="10" width="56" height="20" rx="4" fill="#1e5ee6" opacity="0.2" />
      <text x="208" y="24" fill="#5d8efa" font-size="10" font-weight="600" text-anchor="middle">2 Modes</text>

      <text x="24" y="52" fill="#8b9cb0" font-size="11">Modes: <tspan fill="#ffffff">Light</tspan> | <tspan fill="#ffffff">Dark</tspan></text>
      
      <!-- Token items -->
      <text x="24" y="78" fill="#c6d2df" font-size="11" font-family="'JetBrains Mono', monospace">color/bg/canvas</text>
      <text x="24" y="100" fill="#c6d2df" font-size="11" font-family="'JetBrains Mono', monospace">color/bg/surface</text>
      <text x="24" y="122" fill="#5d8efa" font-size="11" font-family="'JetBrains Mono', monospace">color/bg/brand</text>
      <text x="24" y="144" fill="#c6d2df" font-size="11" font-family="'JetBrains Mono', monospace">color/text/primary</text>
    </g>

    <!-- Collection 3: Components (Active selection) -->
    <g transform="translate(16, 332)">
      <rect width="248" height="140" rx="6" fill="#101927" stroke="#1e5ee6" stroke-width="1.5" />
      <text x="12" y="24" fill="#ffffff" font-size="12" font-weight="600">📂 03_Components (26)</text>
      
      <text x="24" y="52" fill="#8b9cb0" font-size="11">Active Component: <tspan fill="#ffffff">Button</tspan></text>
      <rect x="16" y="64" width="216" height="26" rx="4" fill="#1e5ee6" opacity="0.25" />
      <text x="24" y="81" fill="#ffffff" font-size="11" font-weight="600" font-family="'JetBrains Mono', monospace">button/primary/bg</text>
      <text x="24" y="105" fill="#8b9cb0" font-size="11" font-family="'JetBrains Mono', monospace">button/primary/text</text>
      <text x="24" y="127" fill="#8b9cb0" font-size="11" font-family="'JetBrains Mono', monospace">button/radius</text>
    </g>

    <!-- Middle Canvas: The Component in Figma Auto Layout -->
    <g transform="translate(280, 82)">
      <!-- Canvas background dot grid -->
      <rect width="560" height="598" fill="#0a0f18" />
      
      <!-- Canvas Frame Title -->
      <text x="32" y="36" fill="#8b9cb0" font-size="11" font-weight="600">Canvas / Core Components / Button / Primary</text>

      <!-- Dimension Guides & Auto Layout bounding box -->
      <g transform="translate(120, 180)">
        <!-- Outer selection stroke -->
        <rect x="-8" y="-8" width="316" height="72" rx="8" fill="none" stroke="#1e5ee6" stroke-width="1" stroke-dasharray="4 4" />
        
        <!-- Figma node badge -->
        <rect x="-8" y="-28" width="168" height="20" rx="4" fill="#1e5ee6" />
        <text x="4" y="-14" fill="#ffffff" font-size="10" font-weight="600">❖ Button / Primary / Md</text>

        <!-- Figma Auto Layout Pills -->
        <rect x="250" y="-28" width="58" height="20" rx="4" fill="#141e2e" stroke="#1f2d42" stroke-width="1" />
        <text x="279" y="-14" fill="#8b9cb0" font-size="10" text-anchor="middle">40 × 300</text>

        <!-- The Actual Component Button -->
        <rect width="300" height="56" rx="6" fill="#1e5ee6" />
        
        <!-- Leading Icon -->
        <path d="M 28 28 L 34 22 L 40 28 M 34 34 L 34 22" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
        
        <!-- Button Text Label -->
        <text x="52" y="34" fill="#ffffff" font-size="15" font-weight="600">Publish Token Library</text>

        <!-- Auto Layout Padding Callouts -->
        <line x1="0" y1="62" x2="16" y2="62" stroke="#5d8efa" stroke-width="1.5" />
        <text x="8" y="76" fill="#5d8efa" font-size="9" text-anchor="middle">16px</text>

        <line x1="284" y1="62" x2="300" y2="62" stroke="#5d8efa" stroke-width="1.5" />
        <text x="292" y="76" fill="#5d8efa" font-size="9" text-anchor="middle">16px</text>
      </g>

      <!-- Token Flow Indicator Overlay -->
      <g transform="translate(60, 360)">
        <rect width="440" height="180" rx="8" fill="#141e2e" stroke="#1f2d42" stroke-width="1" />
        <text x="20" y="30" fill="#ffffff" font-size="13" font-weight="600">3-Layer Resolution in Current Theme (Light)</text>

        <!-- Step 1 -->
        <rect x="20" y="50" width="120" height="50" rx="6" fill="#101927" stroke="#10b981" stroke-width="1" />
        <text x="30" y="70" fill="#10b981" font-size="9" font-weight="700">L3 COMPONENT</text>
        <text x="30" y="88" fill="#ffffff" font-size="10" font-family="'JetBrains Mono', monospace">button/primary/bg</text>

        <path d="M 148 75 L 168 75" fill="none" stroke="#5d8efa" stroke-width="2" marker-end="url(#arrow)" />

        <!-- Step 2 -->
        <rect x="176" y="50" width="120" height="50" rx="6" fill="#101927" stroke="#f59e0b" stroke-width="1" />
        <text x="186" y="70" fill="#f59e0b" font-size="9" font-weight="700">L2 SEMANTIC</text>
        <text x="186" y="88" fill="#ffffff" font-size="10" font-family="'JetBrains Mono', monospace">color/bg/brand</text>

        <path d="M 304 75 L 324 75" fill="none" stroke="#5d8efa" stroke-width="2" />

        <!-- Step 3 -->
        <rect x="332" y="50" width="88" height="50" rx="6" fill="#101927" stroke="#1e5ee6" stroke-width="1" />
        <text x="342" y="70" fill="#5d8efa" font-size="9" font-weight="700">L1 PRIMITIVE</text>
        <text x="342" y="88" fill="#ffffff" font-size="10" font-family="'JetBrains Mono', monospace">#1e5ee6</text>

        <text x="20" y="140" fill="#8b9cb0" font-size="11">✓ Bound via Figma Variables REST API &amp; W3C DTCG Format</text>
        <text x="20" y="160" fill="#8b9cb0" font-size="11">✓ Zero hardcoded values in components</text>
      </g>
    </g>

    <!-- Right Sidebar: Dev Mode Code Inspection Panel -->
    <g transform="translate(840, 82)">
      <rect width="360" height="598" fill="#141e2e" stroke="#1f2d42" stroke-width="1" />
      
      <!-- Dev Mode Header -->
      <text x="20" y="34" fill="#ffffff" font-size="13" font-weight="700">Code Inspect (CSS)</text>
      <text x="290" y="34" fill="#5d8efa" font-size="11" font-weight="600">Copy CSS</text>

      <line x1="0" y1="50" x2="360" y2="50" stroke="#1f2d42" stroke-width="1" />

      <!-- Code Inspector Box -->
      <g transform="translate(16, 66)">
        <rect width="328" height="240" rx="6" fill="#0d1522" stroke="#1f2d42" stroke-width="1" />
        
        <text x="16" y="28" fill="#8b9cb0" font-size="11" font-family="'JetBrains Mono', monospace">/* Trilayer Button / Primary / Md */</text>
        
        <text x="16" y="56" fill="#c6d2df" font-size="11" font-family="'JetBrains Mono', monospace">.ds-btn--primary {</text>
        
        <text x="28" y="82" fill="#5d8efa" font-size="11" font-family="'JetBrains Mono', monospace">background<tspan fill="#c6d2df">: </tspan><tspan fill="#34d399">var(--btn-primary-bg)</tspan>;</text>
        <text x="38" y="98" fill="#8b9cb0" font-size="10" font-family="'JetBrains Mono', monospace">/* → var(--sem-color-bg-brand) */</text>
        <text x="38" y="112" fill="#8b9cb0" font-size="10" font-family="'JetBrains Mono', monospace">/* → #2d55ff */</text>

        <text x="28" y="136" fill="#5d8efa" font-size="11" font-family="'JetBrains Mono', monospace">color<tspan fill="#c6d2df">: </tspan><tspan fill="#34d399">var(--btn-primary-text)</tspan>;</text>
        <text x="28" y="158" fill="#5d8efa" font-size="11" font-family="'JetBrains Mono', monospace">border-radius<tspan fill="#c6d2df">: </tspan><tspan fill="#34d399">var(--btn-radius)</tspan>;</text>
        <text x="28" y="180" fill="#5d8efa" font-size="11" font-family="'JetBrains Mono', monospace">padding<tspan fill="#c6d2df">: </tspan><tspan fill="#34d399">0 var(--btn-md-padding-x)</tspan>;</text>
        <text x="28" y="202" fill="#5d8efa" font-size="11" font-family="'JetBrains Mono', monospace">height<tspan fill="#c6d2df">: </tspan><tspan fill="#34d399">var(--btn-md-height)</tspan>;</text>

        <text x="16" y="226" fill="#c6d2df" font-size="11" font-family="'JetBrains Mono', monospace">}</text>
      </g>

      <!-- Token Properties Table -->
      <g transform="translate(16, 326)">
        <text x="0" y="18" fill="#8b9cb0" font-size="11" font-weight="700" letter-spacing="0.05em">BOUND VARIABLES</text>

        <!-- Prop 1 -->
        <rect y="30" width="328" height="42" rx="4" fill="#1b273b" />
        <text x="12" y="48" fill="#ffffff" font-size="11" font-weight="600">Fill</text>
        <text x="12" y="62" fill="#8b9cb0" font-size="10" font-family="'JetBrains Mono', monospace">button/primary/bg</text>
        <circle cx="304" cy="51" r="7" fill="#1e5ee6" stroke="#ffffff" stroke-width="1.5" />

        <!-- Prop 2 -->
        <rect y="78" width="328" height="42" rx="4" fill="#1b273b" />
        <text x="12" y="96" fill="#ffffff" font-size="11" font-weight="600">Corner Radius</text>
        <text x="12" y="110" fill="#8b9cb0" font-size="10" font-family="'JetBrains Mono', monospace">button/radius (6px)</text>
        <text x="312" y="103" fill="#ffffff" font-size="11" font-weight="600" text-anchor="end">6px</text>

        <!-- Prop 3 -->
        <rect y="126" width="328" height="42" rx="4" fill="#1b273b" />
        <text x="12" y="144" fill="#ffffff" font-size="11" font-weight="600">Padding Horizontal</text>
        <text x="12" y="158" fill="#8b9cb0" font-size="10" font-family="'JetBrains Mono', monospace">button/padding/x/md</text>
        <text x="312" y="151" fill="#ffffff" font-size="11" font-weight="600" text-anchor="end">16px</text>
      </g>
    </g>
  </g>
</svg>

